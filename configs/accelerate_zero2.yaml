compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
# No mixed_precision with deepspeed_config_file (accelerate forbids it; bf16 via TrainingArgs/DS json).
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
use_cpu: false
deepspeed_config:
  deepspeed_config_file: configs/deepspeed_zero2.json
  deepspeed_multinode_launcher: standard
  zero3_init_flag: false
